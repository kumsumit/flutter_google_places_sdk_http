name: flutter_google_places_sdk_http
description: An http implementation of Flutter plugin to be used by other platform implementation
version: 0.3.0
homepage: https://github.com/matanshukry/flutter_google_places_sdk/tree/master/flutter_google_places_sdk_http
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  latlong2: ^0.10.1
  flutter_google_places_sdk_platform_interface:
    git: https://github.com/kumsumit/flutter_google_places_sdk_platform_interface.git
  freezed_annotation: 
    git: https://github.com/kumsumit/freezed_annotation.git
  json_annotation: ^4.12.0

dev_dependencies:
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  freezed: 
    git: https://github.com/kumsumit/freezed.git
  mockito: ^5.8.1